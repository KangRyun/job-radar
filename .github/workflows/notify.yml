name: notion-job-notify

# 정기 실행은 pipeline.yml이 담당한다(state push 경합 방지). 여기는 수동 전용.
on:
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write             # state.json 커밋용

concurrency:
  group: notion-job-notify    # 실행 중복 방지 (중복 알림의 주요 원인)
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run notifier
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          MM_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' }}  # 수동 실행은 야간에도 발송
        run: python notify.py

      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]"
          git pull --rebase origin main
          git push
