name: daily-digest

on:
  schedule:
    - cron: "0 0,4 * * *"     # UTC 00:00, 04:00 = KST 09:00, 13:00
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check secrets are set
        env:
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: |
          if [ -z "$NOTION_DATA_SOURCE_ID" ]; then
            echo "::error::NOTION_DATA_SOURCE_ID secret is empty — register it at Settings > Secrets"
            exit 1
          fi
          echo "OK — NOTION_DATA_SOURCE_ID is set (length ${#NOTION_DATA_SOURCE_ID})"

      - name: Send daily digest
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          MM_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
        run: python digest.py
